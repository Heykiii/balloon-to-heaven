name: Test, build and publish

# Builds the game with Unity through GameCI:
#   * EditMode tests
#   * WebGL build deployed to GitHub Pages (play in the browser)
#   * Android APK attached to a GitHub Release (download and install)
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   UNITY_LICENSE   full contents of your Unity_lic.ulf file
#   UNITY_EMAIL     Unity account email
#   UNITY_PASSWORD  Unity account password

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

jobs:
  check:
    name: Check Unity license secrets
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - id: check
        run: |
          if [ -z "$UNITY_LICENSE" ] || [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo "::warning title=Unity license missing::Add UNITY_LICENSE, UNITY_EMAIL and UNITY_PASSWORD under Settings > Secrets and variables > Actions, then re-run this workflow."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

  tests:
    name: EditMode tests
    needs: check
    if: needs.check.outputs.ok == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-test-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-test-
      - uses: game-ci/unity-test-runner@v4
        id: tests
        with:
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: EditMode test results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ${{ steps.tests.outputs.artifactsPath }}

  webgl:
    name: Build WebGL
    needs: [ check, tests ]
    # Build even if a test fails, so there is always something to play.
    if: ${{ !cancelled() && needs.check.outputs.ok == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-WebGL-
      - uses: game-ci/unity-builder@v4
        with:
          targetPlatform: WebGL
          buildName: WebGL
          buildsPath: build
          buildMethod: BalloonToHeaven.EditorTools.BuildScript.BuildWebGL
      - name: Add a no-Jekyll marker for Pages
        run: sudo touch build/WebGL/WebGL/.nojekyll && ls -la build/WebGL/WebGL
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/WebGL/WebGL

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: webgl
    if: ${{ !cancelled() && needs.webgl.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  android:
    name: Build Android APK
    needs: [ check, tests ]
    if: ${{ !cancelled() && needs.check.outputs.ok == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Free disk space (Android builds are large)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-Android-
      - uses: game-ci/unity-builder@v4
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        with:
          targetPlatform: Android
          androidExportType: androidPackage
          buildName: BalloonToHeaven
          buildsPath: build
          buildMethod: BalloonToHeaven.EditorTools.BuildScript.BuildAndroid
      - name: Locate APK
        id: apk
        run: |
          APK=$(find build -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then echo "No APK produced"; exit 1; fi
          sudo cp "$APK" BalloonToHeaven.apk
          echo "path=BalloonToHeaven.apk" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: BalloonToHeaven-apk
          path: BalloonToHeaven.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Balloon to Heaven (build ${{ github.run_number }})
          body: |
            Android APK built from ${{ github.sha }}.
            Install: download BalloonToHeaven.apk on your phone, open it, and allow installs from this source.
            Play in the browser: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          files: BalloonToHeaven.apk
          make_latest: true
